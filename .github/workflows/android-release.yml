name: Android release (Play Store)

# Builds a signed Android App Bundle (.aab) for Google Play.
# Run it from Actions → "Android release (Play Store)" → Run workflow, or push a tag like v1.2.0.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of your upload keystore (.jks)   — required
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD — required
#   PLAY_SERVICE_ACCOUNT_JSON  Google Play service-account key        — optional: uploads to a track
# Repository variables: the same VITE_* values as the website build.
# See docs/STORE_RELEASE.md.

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track to upload to (needs PLAY_SERVICE_ACCOUNT_JSON)'
        type: choice
        options: [none, internal, alpha, beta, production]
        default: internal
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  aab:
    runs-on: ubuntu-latest
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Check the signing secrets are set
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Add ANDROID_KEYSTORE_BASE64 and the password secrets first — see docs/STORE_RELEASE.md"
            exit 1
          fi
      - name: Build the app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_OTP_CHANNEL: ${{ vars.VITE_OTP_CHANNEL }}
          VITE_ABDM_ENABLED: ${{ vars.VITE_ABDM_ENABLED }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then echo "::warning::VITE_SUPABASE_URL isn't set — this build will run the demo, which must not go to the Play Store."; fi
          npm run build
      - run: npx cap sync android
      - name: Build signed AAB
        working-directory: android
        env:
          NIVEDA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NIVEDA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NIVEDA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export NIVEDA_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          # Every Play upload needs a higher versionCode; the run number always goes up.
          export NIVEDA_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          export NIVEDA_VERSION_NAME="$(node -p "require('../package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export NIVEDA_VERSION_NAME="${GITHUB_REF_NAME#v}"; fi
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/Niveda.aab"
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: Niveda-aab
          path: Niveda.aab
      - name: Upload to Google Play
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.track != 'none' && env.PLAY_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: in.niveda.app
          releaseFiles: Niveda.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.track == 'production' && 'draft' || 'completed' }}
