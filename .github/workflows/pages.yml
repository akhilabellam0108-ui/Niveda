name: Deploy to GitHub Pages

# Publishes Niveda at https://<owner>.github.io/Niveda/ (and the demo at …/demo/) on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# The app uses hash routing and relative paths, so no extra configuration is needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The demo (fictional data, stored in the browser) is kept at /demo.
      - name: Build the demo
        run: npm run build && mv dist "$RUNNER_TEMP/demo"
      # The real app, connected to Supabase when the repository variables
      # VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY are set (Settings → Secrets
      # and variables → Actions → Variables). Without them it is the demo too.
      - name: Build the app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      - run: mv "$RUNNER_TEMP/demo" dist/demo && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
