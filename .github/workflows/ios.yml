name: iPhone app

# On every pull request and push to main: checks the iPhone app builds (simulator, no signing).
# Run it by hand with "testflight" ticked to sign it and upload to TestFlight / App Store Connect.
#
# For TestFlight you need an Apple Developer account and these repository secrets:
#   APPLE_TEAM_ID                10-character team id (developer.apple.com → Membership)
#   ASC_KEY_ID, ASC_ISSUER_ID    App Store Connect API key (Users and Access → Integrations → Keys, role App Manager)
#   ASC_KEY_P8_BASE64            base64 of the downloaded AuthKey_XXXX.p8
# Signing is automatic (Xcode creates the certificate and profile through the API key).
# See docs/STORE_RELEASE.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Sign and upload to TestFlight'
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_OTP_CHANNEL: ${{ vars.VITE_OTP_CHANNEL }}
          VITE_ABDM_ENABLED: ${{ vars.VITE_ABDM_ENABLED }}
        run: npm run build
      - run: npx cap sync ios

      - name: Build for the simulator (no signing)
        if: ${{ !inputs.testflight }}
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tail -20

      - name: Archive, sign and upload to TestFlight
        if: ${{ inputs.testflight }}
        working-directory: ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$TEAM" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER" ] || [ -z "$P8" ]; then
            echo "::error::Add APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8_BASE64 — see docs/STORE_RELEASE.md"; exit 1
          fi
          KEY="$RUNNER_TEMP/AuthKey.p8"; echo "$P8" | base64 -d > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          VERSION="$(node -p "require('../../package.json').version")"
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Niveda.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            "${AUTH[@]}" archive | tail -20
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Niveda.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" | tail -20
          rm -f "$KEY"
          echo "Uploaded build $GITHUB_RUN_NUMBER — it appears in App Store Connect → TestFlight after processing."
